name: Sync Moodle kalendář

on:
  schedule:
    - cron: '0 5 * * *'  # každý den v 5:00 UTC (7:00 česky)
  workflow_dispatch:  # umožní ruční spuštění tlačítkem

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Nastavit Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Nainstalovat závislosti
        run: pip install icalendar

      - name: Stáhnout a zpracovat kalendář
        env:
          MOODLE_ICAL_URL: ${{ secrets.MOODLE_ICAL_URL }}
        run: python scripts/sync_kalendar.py

      - name: Commit změn
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add terminy.json
          git diff --staged --quiet || git commit -m "Aktualizace termínů z Moodlu"
          git push
