<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studijní přehled</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Studijní přehled</h1>
  </header>

  <main>
    <div id="view-domov">
      <section id="predmety">
        <h2>Moje předměty</h2>
        <div id="predmety-list" class="card-list"></div>
        <form id="pridat-predmet-form" class="pridat-form">
          <input type="text" id="novy-predmet" placeholder="Název předmětu" required>
          <button type="submit">Přidat</button>
        </form>
      </section>

      <section id="kalendar-sekce">
        <div class="kalendar-hlavicka">
          <button id="mesic-predchozi" class="kalendar-sipka" type="button">&lsaquo;</button>
          <h2 id="kalendar-nadpis"></h2>
          <button id="mesic-dalsi" class="kalendar-sipka" type="button">&rsaquo;</button>
        </div>
        <div id="kalendar-mrizka" class="kalendar-mrizka"></div>
        <div id="kalendar-detail" class="kalendar-detail"></div>
      </section>
    </div>

    <section id="view-predmet" class="hidden">
      <button id="zpet-btn" class="zpet-btn" type="button">&larr; Zpět na přehled</button>
      <h2 id="predmet-nadpis"></h2>
      <div id="sekce-list" class="card-list"></div>
      <form id="sekce-form" class="pridat-form-sloupec">
        <input type="text" id="sekce-nazev-input" placeholder="Název sekce (např. 1. Úvod)" required>
        <div class="rte" id="sekce-popis-input" contenteditable="true"
             data-placeholder="Vlož text z Moodlu (Ctrl+C na Moodlu, Ctrl+V sem) – zachová tučné písmo a odstavce…"></div>
        <div class="form-akce">
          <button type="submit" id="sekce-submit-btn">Přidat sekci</button>
          <button type="button" id="sekce-zrusit-btn" class="btn-sekundarni hidden">Zrušit úpravu</button>
        </div>
      </form>
    </section>

    <section id="view-sekce" class="hidden">
      <button id="zpet-sekce-btn" class="zpet-btn" type="button">&larr; Zpět na předmět</button>
      <h2 id="sekce-nadpis"></h2>

      <div class="podsekce">
        <h3>Poznámky</h3>
        <div id="poznamky-list" class="card-list"></div>
        <form id="poznamka-form" class="pridat-form-sloupec">
          <input type="text" id="poznamka-nazev-input" placeholder="Název bloku (např. Kontrolní otázky)" required>
          <div class="rte" id="poznamka-popis-input" contenteditable="true"
               data-placeholder="Text, poznámky, vzorce…"></div>
          <div class="form-akce">
            <button type="submit" id="poznamka-submit-btn">Přidat poznámku</button>
            <button type="button" id="poznamka-zrusit-btn" class="btn-sekundarni hidden">Zrušit úpravu</button>
          </div>
        </form>
      </div>

      <div class="podsekce">
        <h3>Materiály</h3>
        <div id="materialy-list" class="card-list"></div>
        <form id="material-form" class="pridat-form">
          <input type="text" id="material-nazev-input" placeholder="Název (např. Studijní materiál - téma 1)" required>
          <input type="url" id="material-odkaz-input" placeholder="Odkaz (URL)" required>
          <button type="submit" id="material-submit-btn">Přidat</button>
        </form>
      </div>


      </section>
  </main>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
