<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studijní přehled</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Studijní přehled</h1>
  </header>

  <main>
    <div id="view-domov">
      <section id="predmety">
        <h2>Moje předměty</h2>
        <div id="predmety-list" class="card-list"></div>
        <form id="pridat-predmet-form" class="pridat-form">
          <input type="text" id="novy-predmet" placeholder="Název předmětu" required>
          <button type="submit">Přidat</button>
        </form>
      </section>

      <section id="kalendar-sekce">
        <div class="kalendar-hlavicka">
          <button id="mesic-predchozi" class="kalendar-sipka" type="button">&lsaquo;</button>
          <h2 id="kalendar-nadpis"></h2>
          <button id="mesic-dalsi" class="kalendar-sipka" type="button">&rsaquo;</button>
        </div>
        <div id="kalendar-mrizka" class="kalendar-mrizka"></div>
        <div id="kalendar-detail" class="kalendar-detail"></div>
      </section>
    </div>

    <section id="view-predmet" class="hidden">
      <button id="zpet-btn" class="zpet-btn" type="button">&larr; Zpět na přehled</button>
      <h2 id="predmet-nadpis"></h2>
      <div id="sekce-list" class="card-list"></div>
      <form id="pridat-sekci-form" class="pridat-form-sloupec">
        <input type="text" id="nova-sekce-nazev" placeholder="Název sekce (např. 1. Úvod)" required>
        <textarea id="nova-sekce-popis" placeholder="Poznámky / obsah (nepovinné)" rows="3"></textarea>
        <button type="submit">Přidat sekci</button>
      </form>
    </section>
  </main>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
