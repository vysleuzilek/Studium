<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studijní přehled</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Studijní přehled</h1>
  </header>

  <main>
    <section id="predmety">
      <h2>Moje předměty</h2>
      <div id="predmety-list" class="card-list"></div>
      <form id="pridat-predmet-form" class="pridat-form">
        <input type="text" id="novy-predmet" placeholder="Název předmětu" required>
        <button type="submit">Přidat</button>
      </form>
    </section>

    <section id="terminy">
      <h2>Nadcházející termíny</h2>
      <div id="terminy-list" class="card-list"></div>
    </section>
  </main>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
